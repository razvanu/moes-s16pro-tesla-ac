# MOES S16Pro — TESLA TA36FFML-1232IAPC (12000 BTU)
# Captured infrared commands: HEAT 22–28 C, fan AUTO, OFF.
# No vendor protocol is assumed; the original Pronto timings are preserved.
# Validate/compile before OTA. New integrated control still needs hardware testing.

esphome:
  name: moes-s16pro
  friendly_name: MOES Tesla
  on_boot:
    priority: -100
    then:
      - delay: 5s
      - lambda: |-
          id(tesla_last_mode) = static_cast<int>(id(climate_primary).mode);
          id(tesla_last_temperature) = id(climate_primary).target_temperature;
          id(initialization_complete) = true;
          ESP_LOGI("tesla", "TESLA TA36FFML-1232IAPC ready; no startup IR command");

bk72xx:
  board: generic-bk7231n-qfn32-tuya

logger:
  level: INFO
  baud_rate: 0

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80

globals:
  - id: initialization_complete
    type: bool
    restore_value: false
    initial_value: "false"
  - id: tesla_last_mode
    type: int
    restore_value: false
    initial_value: "-1"
  - id: tesla_last_temperature
    type: float
    restore_value: false
    initial_value: "-100.0"

remote_transmitter:
  id: ir_transmitter
  pin: P7
  carrier_duty_percent: 50%

remote_receiver:
  id: ir_receiver
  pin:
    number: P8
    inverted: true
  tolerance: 55%
  buffer_size: 8kb
  filter: 50us
  idle: 20ms
  # To capture more codes: change logger level to DEBUG and add dump: all.

uart:
  rx_pin: RX1
  tx_pin: TX1
  baud_rate: 9600

tuya:
  id: tuya_mcu

sensor:
  - platform: tuya
    tuya_id: tuya_mcu
    id: room_temperature
    name: Temperatura camera
    sensor_datapoint: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: tuya
    tuya_id: tuya_mcu
    id: room_humidity
    name: Umiditate camera
    sensor_datapoint: 12
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0

  - platform: wifi_signal
    name: Semnal Wi-Fi
    update_interval: 60s

  - platform: uptime
    name: Timp functionare

text_sensor:
  - platform: version
    name: Versiune ESPHome

  - platform: wifi_info
    ip_address:
      name: Adresa IP
    ssid:
      name: Retea Wi-Fi

binary_sensor:
  - platform: status
    name: Stare conexiune

button:
  - platform: restart
    name: Restart

  # Direct IR test buttons: intentionally do not modify touchscreen state.
  - platform: template
    name: Tesla Incalzire 24 Auto
    on_press:
      - script.execute:
          id: tesla_send
          temperature: 24

  - platform: template
    name: Tesla Oprire
    on_press:
      - script.execute:
          id: tesla_send
          temperature: -1

climate:
  # Main entity keeps its existing ID for MCU / display integration.
  # Fan speed is fixed AUTO in all captured commands.
  - platform: tuya
    tuya_id: tuya_mcu
    id: climate_primary
    name: Tesla AC
    visual:
      min_temperature: 22
      max_temperature: 28
      temperature_step: 1
    switch_datapoint: 1
    target_temperature_datapoint: 3
    target_temperature_multiplier: 1
    current_temperature_datapoint: 2
    current_temperature_multiplier: 0.1
    supports_heat: true
    supports_cool: false
    active_state:
      datapoint: 4
      heating_value: 1
    on_state:
      - if:
          condition:
            lambda: return id(initialization_complete);
          then:
            - script.execute: tesla_sync

script:
  # Coalesce a power/mode/setpoint update into one complete IR command.
  - id: tesla_sync
    mode: restart
    then:
      - delay: 300ms
      - lambda: |-
          if (!id(initialization_complete)) return;
          const auto mode = id(climate_primary).mode;
          const float target = id(climate_primary).target_temperature;
          const int mode_number = static_cast<int>(mode);

          if (mode != climate::CLIMATE_MODE_OFF &&
              mode != climate::CLIMATE_MODE_HEAT) {
            ESP_LOGW("tesla", "Only HEAT/OFF commands have been captured");
            return;
          }

          int temperature = -1;
          if (mode == climate::CLIMATE_MODE_HEAT) {
            if (!std::isfinite(target)) return;
            temperature = static_cast<int>(std::round(target));
            if (temperature < 22 || temperature > 28 ||
                std::abs(target - temperature) > 0.1f) {
              ESP_LOGW("tesla", "Select a whole-degree target from 22 to 28 C");
              return;
            }
          }

          if (mode_number == id(tesla_last_mode)) {
            if (mode == climate::CLIMATE_MODE_OFF) return;
            if (std::isfinite(id(tesla_last_temperature)) &&
                std::abs(target - id(tesla_last_temperature)) < 0.1f) return;
          }

          id(tesla_last_mode) = mode_number;
          id(tesla_last_temperature) = target;
          id(tesla_send).execute(temperature);

  - id: tesla_send
    mode: single
    parameters:
      temperature: int
    then:
      - if:
          condition:
            lambda: return temperature == -1 || (temperature >= 22 && temperature <= 28);
          then:
            - lambda: |-
                ESP_LOGI("tesla", "Send TESLA TA36FFML-1232IAPC: %s, target=%d, fan=AUTO",
                         temperature == -1 ? "OFF" : "HEAT", temperature);
            - remote_transmitter.transmit_pronto:
                transmitter_id: ir_transmitter
                data: !lambda |-
                  switch (temperature) {
                    case 22:
                      return std::string("0000 006D 006A 0000 0157 00B1 0016 0042 0015 0042 0016 0016 0014 0019 0014 0018 0015 0018 0014 0043 0015 0043 0015 0044 0014 0044 0014 0043 0015 0018 0014 0042 0016 0042 0017 0040 0017 0018 0015 0016 0015 0018 0015 0016 0015 0018 0014 0019 0014 0042 0016 0042 0016 0042 0016 0018 0014 0019 0013 0018 0014 0019 0014 0019 0014 0018 0014 0018 0015 0019 0014 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0043 0015 0018 0015 0043 0015 0018 0014 0019 0014 0018 0014 0019 0014 0019 0012 0019 0014 0019 0014 0019 0014 0018 0013 0019 0014 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0044 0014 0019 0014 0018 0014 0019 0014 0018 0014 0019 0014 0019 0014 0019 0014 0018 0014 0019 0014 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0018 0015 0018 0014 0019 0014 0044 0014 0044 0014 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0018 0015 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0019 0014 0018 0015 0018 0014 0044 0014 0019 0014 0043 0015 0018 0014 0044 0014 0044 0014 0018 0015 0302");
                    case 23:
                      return std::string("0000 006D 006A 0000 0156 00B1 0014 0043 0015 0043 0014 0019 0014 0019 0014 0018 0012 001A 0012 0043 0015 0045 0012 0045 0012 0044 0014 0044 0014 0044 0012 0044 0014 0043 0015 0043 0015 001A 0012 0019 0014 0019 0012 0019 0015 0018 0014 0019 0014 0042 0016 0042 0015 0042 0016 0018 0014 0018 0014 0018 0014 0019 0014 0019 0014 0018 0014 0018 0015 0019 0014 0018 0014 0019 0014 0018 0014 0019 0014 0019 0012 0044 0014 0018 0014 0043 0015 0019 0012 0019 0014 0019 0014 0018 0014 0018 0014 0019 0014 0018 0014 0019 0014 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0019 0014 0018 0014 0044 0014 0019 0014 0018 0014 0019 0014 0018 0014 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0018 0014 0019 0014 0019 0014 0043 0014 0044 0014 0019 0014 0019 0014 0018 0014 0019 0014 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0019 0014 0018 0014 0019 0014 0018 0014 0044 0014 0019 0014 0018 0014 0044 0014 0044 0014 0044 0014 0019 0014 0302");
                    case 24:
